# Blueprint do Render: cria o banco PostgreSQL e o backend (API) automaticamente.
# No Render: New > Blueprint > selecione este repositório.
databases:
  - name: reserva-mesas-db
    plan: free
    databaseName: reservas
    user: reservas

services:
  - type: web
    name: reserva-mesas-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    # Aplica as migrations e o seed (idempotente) antes de iniciar a API
    startCommand: npx prisma migrate deploy && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: reserva-mesas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false # preencher com a URL da Vercel
      - key: ADMIN_NOME
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
